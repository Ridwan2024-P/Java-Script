<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.2/css/all.min.css"/>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Bebas+Neue&family=Comfortaa:wght@300..700&family=Kaushan+Script&family=League+Spartan:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="player-container">
        <!-- SOng -->
         <div class="img-container">
            <img src="img/jacinto-1.jpg" alt="image auto">
         </div>
         <h2 id="tittle">Electric CHill Machine</h2>
         <h3 id="artist">Jacinto</h3>
         <audio src="music/jacinto-1.mp3" ></audio>
         <!-- Progress -->
          <div class="progress-container" id="progress-container">
            <div class="progress" id="progress"></div>
               <div class="duration-wrapper">
                <span id="current-time">0:00</span>
                <span id="duration">2:06</span>
                </div>

        </div>
    <!-- Cobtrols -->
             <div class="player-controls">
                <i class="fas fa-backward" id="prev" title="Prevviews"></i>
                  <i class="fas fa-play main-button" id="play" title="Play"></i>
                    <i class="fas fa-forward" id="next" title="Next"></i>
             </div>
          </div>
    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
