<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Countdown</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Bebas+Neue&family=Comfortaa:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kaushan+Script&family=League+Spartan:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    </head>
<body>
    <video src="time.mp4" class="video-background " loop muted autoplay></video>
    <div class="video-overlay"></div>
    <div class="container">
        <div class="input-container" id="input-container" hidden>
            <h1>Create a Custom Countdown</h1>
            <form action="" class="form" id="countdownForm">
                <label for="tittle">Tittle</label>
                <input type="text" id="title" placeholder="What are you counting down to ">
                <label for="date-picker">Select a Date</label>
                <input type="date" id="date-picker">
                <button type="submit">Submit</button>

            </form>
        </div>
        <!-- CountDown -->
         <div class="countdown" id="coumtdown" hidden>
            <h1 id="countdown-tittle">CountDown Tittle Here</h1>
            <ul>
                <li><span>3</span>Days</li>
                <li><span>6</span>Hours</li>
                <li><span>45</span>Minutes</li>
                <li><span>52</span>Seconds</li>
            </ul>
            <button id="countdown-button">Reset</button>
         </div>
         <!-- Complate -->
          <div class="complete" id="complete">
            <h1 class="complete-tittle">Countdown Complete!</h1>
            <h1 id="complete-info">Countdown Finished on 05-05-2020</h1>
            <button id="complete-button">New Countdown</button>
          </div>
    </div>
    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
