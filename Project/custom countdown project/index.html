<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom Countdown</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@100;200;300;400;500;600;700;800;900&family=Bebas+Neue&family=Comfortaa:wght@300..700&family=Inter:wght@100..900&family=Kaushan+Script&family=League+Spartan:wght@100..900&family=Montserrat:wght@100..900&family=Nunito:wght@200..1000&family=Open+Sans:wght@300..800&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>

<body>

    <video src="time.mp4" class="video-background" loop muted autoplay></video>

    <div class="video-overlay"></div>

    <div class="container">

        <!-- Input -->
        <div class="input-container" id="input-container">

            <h1>Create a Custom Countdown</h1>

            <form action="" class="form" id="countdownForm">

                <label for="title">Title</label>

                <input
                    type="text"
                    id="title"
                    placeholder="What are you counting down to"
                    required
                >

                <label for="date-picker">Select a Date</label>

                <input
                    type="date"
                    id="date-picker"
                    required
                >

                <button type="submit">Submit</button>

            </form>

        </div>


        <!-- Countdown -->
        <div class="countdown" id="countdown" hidden>

            <h1 id="countdown-title">
                Countdown Title Here
            </h1>

            <ul>

                <li>
                    <span>0</span>
                    Days
                </li>

                <li>
                    <span>0</span>
                    Hours
                </li>

                <li>
                    <span>0</span>
                    Minutes
                </li>

                <li>
                    <span>0</span>
                    Seconds
                </li>

            </ul>

            <button id="countdown-button">
                Reset
            </button>

        </div>


        <!-- Complete -->
        <div class="complete" id="complete" hidden>

            <h1 class="complete-title">
                Countdown Complete!
            </h1>

            <h1 id="complete-info">
                Countdown Finished
            </h1>

            <button id="complete-button">
                New Countdown
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
